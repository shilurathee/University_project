{% extends 'base.html' %}
{% block title %}Edit Course{% endblock %}
{% block content %}

<h2 class="section-title">Edit Course</h2>

<form method="POST">
    <label>Course Code</label>
    <input type="text" name="course_code" value="{{ course.course_code }}" required><br>

    <label>Course Name</label>
    <input type="text" name="course_name" value="{{ course.course_name }}" required><br>

    <label>Credits</label>
    <input type="number" name="credits" value="{{ course.credits }}"><br>

    <label>Department</label>
    <input type="text" name="department" value="{{ course.department }}"><br>

    <label>Assign Teacher</label>
    <select name="teacher_id">
        <option value="">-- No Teacher --</option>
        {% for teacher in teachers %}
        <option value="{{ teacher.teacher_id }}"
            {% if teacher.teacher_id == course.teacher_id %}selected{% endif %}>
            {{ teacher.teacher_name }}
        </option>
        {% endfor %}
    </select><br>

    <button type="submit">Update Course</button>
</form>
{% endblock %}

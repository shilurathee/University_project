{% extends 'base.html' %}

{% block title %}Add Grade Cutoff{% endblock %}

{% block content %}
<h2 class="section-title">Add Grade Cutoff</h2>
<p class="section-subtitle">Create a grade boundary for a course.</p>

<form method="POST">
    <label>Course</label>
    <select name="course_id" required>
        <option value="">-- Select Course --</option>
        {% for course in courses %}
        <option value="{{ course.course_id }}">{{ course.course_name }} ({{ course.course_code }})</option>
        {% endfor %}
    </select>

    <label>Grade Name</label>
    <input type="text" name="grade_name" placeholder="A / B / C / S" required>

    <label>Min Marks</label>
    <input type="number" step="0.01" name="min_marks" required>

    <label>Max Marks</label>
    <input type="number" step="0.01" name="max_marks" required>

    <button type="submit">Add Grade Cutoff</button>
</form>
{% endblock %}

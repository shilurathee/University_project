
{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="login-container">
    <div class="login-form-wrapper">
        <div class="login-header">
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-subtitle">Sign in to continue to the portal</p>
        </div>

        <form method="POST" class="login-form">
            <div class="role-selector">
                <button type="button" id="btn-admin" class="role-btn" onclick="selectRole('admin')">
                    <span class="role-icon">👨‍💼</span>
                    <span>Admin</span>
                </button>
                <button type="button" id="btn-teacher" class="role-btn" onclick="selectRole('teacher')">
                    <span class="role-icon">👨‍🏫</span>
                    <span>Teacher</span>
                </button>
                <button type="button" id="btn-student" class="role-btn" onclick="selectRole('student')">
                    <span class="role-icon">👨‍🎓</span>
                    <span>Student</span>
                </button>
            </div>

            <input type="hidden" name="role" id="role-input" value="">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>
    </div>
</div>

<script>
function selectRole(role) {
    document.getElementById('role-input').value = role;
    ['admin', 'teacher', 'student'].forEach(function(r) {
        var btn = document.getElementById('btn-' + r);
        btn.classList.remove('active');
    });
    var selected = document.getElementById('btn-' + role);
    selected.classList.add('active');
}
</script>

{% endblock %}
